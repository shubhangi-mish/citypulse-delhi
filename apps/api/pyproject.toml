[project]
name = "citypulse-api"
version = "0.1.0"
description = "CityPulse Delhi API — graph-powered civic coordination on FalkorDB"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "falkordb>=1.0.9",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "langgraph>=0.2",
  "shapely>=2.0",
  "email-validator>=2.2",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: tests that call real external data sources"]

[tool.ruff]
line-length = 110
